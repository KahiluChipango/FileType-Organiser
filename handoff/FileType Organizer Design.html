<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileType Organizer Pro — Design Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ededea; font-family: 'Plus Jakarta Sans', sans-serif; }

  /* DS tokens */
  :root {
    --bg: #f8f8f5;
    --surface: #ffffff;
    --surface2: #f2f2ef;
    --border: #e4e4dc;
    --border2: #d0d0c8;
    --txt1: #1a1a17;
    --txt2: #5c5c56;
    --txt3: #9b9b93;
    --accent: #1a6cf0;
    --accent-light: #e8f0fe;
    --accent-hover: #1459d0;
    --green: #16a34a;
    --green-light: #dcfce7;
    --amber: #d97706;
    --amber-light: #fef3c7;
    --red: #dc2626;
    --red-light: #fee2e2;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.06);
  }
</style>
</head>
<body>
<script type="text/babel">

const { useState } = React;

/* ─── Design Tokens ─── */
const T = {
  bg: '#f8f8f5', surface: '#ffffff', surface2: '#f2f2ef',
  border: '#e4e4dc', border2: '#d0d0c8',
  txt1: '#1a1a17', txt2: '#5c5c56', txt3: '#9b9b93',
  accent: '#1a6cf0', accentLight: '#e8f0fe', accentHover: '#1459d0',
  green: '#16a34a', greenLight: '#dcfce7',
  amber: '#d97706', amberLight: '#fef3c7',
  red: '#dc2626', redLight: '#fee2e2',
};

/* ─── Shared primitives ─── */
const Btn = ({ children, variant='primary', size='md', onClick, disabled, style={} }) => {
  const [hov, setHov] = useState(false);
  const base = {
    display:'inline-flex', alignItems:'center', gap:6, border:'none',
    cursor: disabled ? 'default' : 'pointer', fontFamily:'inherit',
    fontWeight:600, letterSpacing:'-0.01em', transition:'all .15s',
    whiteSpace:'nowrap', outline:'none',
  };
  const sizes = { sm: {fontSize:12,padding:'6px 12px',borderRadius:8}, md: {fontSize:13,padding:'9px 18px',borderRadius:10}, lg: {fontSize:14,padding:'12px 24px',borderRadius:12} };
  const variants = {
    primary: { background: hov ? T.accentHover : T.accent, color:'#fff', opacity: disabled ? .45 : 1 },
    secondary: { background: hov ? T.surface2 : T.surface, color: T.txt1, border:`1px solid ${T.border}` },
    ghost: { background: hov ? T.surface2 : 'transparent', color: T.txt2 },
    danger: { background: hov ? '#b91c1c' : T.red, color:'#fff' },
    success: { background: hov ? '#15803d' : T.green, color:'#fff' },
  };
  return <button style={{...base,...sizes[size],...variants[variant],...style}} onClick={onClick}
    onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} disabled={disabled}>{children}</button>;
};

const Tag = ({ children, color='blue' }) => {
  const colors = {
    blue:{bg:T.accentLight,text:T.accent}, green:{bg:T.greenLight,text:T.green},
    amber:{bg:T.amberLight,text:T.amber}, red:{bg:T.redLight,text:T.red},
    gray:{bg:T.surface2,text:T.txt2},
  };
  return <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 9px',borderRadius:99,fontSize:11,fontWeight:600,...colors[color]}}>{children}</span>;
};

const Divider = () => <div style={{height:1,background:T.border,margin:'0'}} />;

/* file type icon */
const FileIcon = ({ ext, color }) => (
  <div style={{width:32,height:38,position:'relative',flexShrink:0}}>
    <svg width="32" height="38" viewBox="0 0 32 38" fill="none">
      <path d="M2 4C2 2.9 2.9 2 4 2H22L30 10V34C30 35.1 29.1 36 28 36H4C2.9 36 2 35.1 2 34V4Z" fill={color+'18'} stroke={color} strokeWidth="1.5"/>
      <path d="M22 2L30 10H24C22.9 10 22 9.1 22 8V2Z" fill={color} opacity=".4"/>
    </svg>
    <span style={{position:'absolute',bottom:5,left:0,right:0,textAlign:'center',fontSize:7,fontWeight:700,color,fontFamily:'JetBrains Mono, monospace',letterSpacing:0}}>{ext}</span>
  </div>
);

/* Category badge with icon */
const CatRow = ({ icon, label, count, color }) => (
  <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0'}}>
    <div style={{width:32,height:32,borderRadius:8,background:color+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,flexShrink:0}}>{icon}</div>
    <div style={{flex:1}}>
      <div style={{fontSize:13,fontWeight:600,color:T.txt1}}>{label}</div>
    </div>
    <Tag color="gray">{count}</Tag>
  </div>
);

/* Progress bar */
const ProgressBar = ({ value, color=T.accent }) => (
  <div style={{height:6,background:T.surface2,borderRadius:99,overflow:'hidden'}}>
    <div style={{height:'100%',width:`${value}%`,background:color,borderRadius:99,transition:'width .3s'}} />
  </div>
);

/* ─── Shared app shell ─── */
const Shell = ({ children, width=720, height=580 }) => (
  <div style={{width,height,background:T.bg,borderRadius:16,overflow:'hidden',display:'flex',flexDirection:'column',fontFamily:'Plus Jakarta Sans, sans-serif',position:'relative',boxShadow:'0 2px 8px rgba(0,0,0,.06)'}}>
    {children}
  </div>
);

/* ─── TOP NAV ─── */
const TopNav = ({ active='home' }) => {
  const items = [
    { id:'home', label:'Organizer' },
    { id:'stats', label:'Statistics' },
    { id:'settings', label:'Settings' },
  ];
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 24px',borderBottom:`1px solid ${T.border}`,background:T.surface,flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:28,height:28,borderRadius:7,background:T.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1.5" fill="white"/><rect x="8" y="1" width="5" height="5" rx="1.5" fill="white" opacity=".6"/><rect x="1" y="8" width="5" height="5" rx="1.5" fill="white" opacity=".6"/><rect x="8" y="8" width="5" height="5" rx="1.5" fill="white" opacity=".4"/></svg>
        </div>
        <span style={{fontSize:14,fontWeight:700,color:T.txt1,letterSpacing:'-0.02em'}}>FileType Organizer</span>
        <Tag color="blue">Pro</Tag>
      </div>
      <div style={{display:'flex',gap:2}}>
        {items.map(i=>(
          <div key={i.id} style={{padding:'5px 12px',borderRadius:8,fontSize:13,fontWeight:500,color:active===i.id?T.accent:T.txt2,background:active===i.id?T.accentLight:'transparent',cursor:'pointer'}}>{i.label}</div>
        ))}
      </div>
      <div style={{width:28,height:28,borderRadius:99,background:T.surface2,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:T.txt2}}>KC</div>
    </div>
  );
};

/* ═══════════════════════════════════════
   VARIATION A — Compact Single Panel
═══════════════════════════════════════ */
const VariantA_Home = () => {
  const [hover, setHover] = useState(false);
  return (
    <Shell width={700} height={560}>
      <TopNav active="home" />
      <div style={{flex:1,display:'flex',flexDirection:'column',padding:'28px 32px',gap:20,overflowY:'auto'}}>
        {/* Drop Zone */}
        <div
          onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
          style={{border:`2px dashed ${hover?T.accent:T.border2}`,borderRadius:14,padding:'40px 32px',textAlign:'center',background:hover?T.accentLight:T.surface,transition:'all .2s',cursor:'pointer',flexShrink:0}}>
          <div style={{width:52,height:52,borderRadius:14,background:hover?T.accent+'20':'#f2f2ef',margin:'0 auto 16px',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .2s'}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={hover?T.accent:T.txt3} strokeWidth="1.8" strokeLinecap="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div style={{fontSize:15,fontWeight:700,color:hover?T.accent:T.txt1,marginBottom:6}}>Drop a folder here</div>
          <div style={{fontSize:13,color:T.txt3,marginBottom:20}}>or browse your computer</div>
          <Btn variant={hover?'primary':'secondary'} size="sm">Browse folder</Btn>
        </div>

        {/* Selected folder row */}
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:'14px 18px',display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:36,height:36,borderRadius:9,background:T.accentLight,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,color:T.txt1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>~/Downloads/My Files</div>
            <div style={{fontSize:11,color:T.txt3,marginTop:1}}>347 files · 2.4 GB</div>
          </div>
          <Tag color="green">Ready</Tag>
        </div>

        {/* Quick stats */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
          {[['Images','84 files',T.accent,'🖼'],['Documents','126 files',T.green,'📄'],['Videos','31 files',T.amber,'🎬']].map(([cat,count,color,icon])=>(
            <div key={cat} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:'14px 16px'}}>
              <div style={{fontSize:18,marginBottom:8}}>{icon}</div>
              <div style={{fontSize:20,fontWeight:800,color:T.txt1,letterSpacing:'-0.03em'}}>{count.split(' ')[0]}</div>
              <div style={{fontSize:11,color:T.txt3,marginTop:2}}>{cat}</div>
            </div>
          ))}
        </div>

        {/* Actions */}
        <div style={{display:'flex',gap:10,marginTop:'auto'}}>
          <Btn variant="secondary" size="md">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            Preview
          </Btn>
          <Btn variant="secondary" size="md">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
            Undo Last
          </Btn>
          <Btn variant="primary" size="md" style={{marginLeft:'auto',paddingLeft:28,paddingRight:28}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Organize Now
          </Btn>
        </div>
      </div>
    </Shell>
  );
};

/* ═══════════════════════════════════════
   VARIATION B — Sidebar Layout
═══════════════════════════════════════ */
const VariantB_Home = () => {
  const [hover, setHover] = useState(false);
  const cats = [
    {icon:'📄',label:'Documents',count:126,color:'#16a34a'},
    {icon:'🖼',label:'Images',count:84,color:'#1a6cf0'},
    {icon:'🎬',label:'Videos',count:31,color:'#7c3aed'},
    {icon:'🎵',label:'Audio',count:18,color:'#db2777'},
    {icon:'📦',label:'Archives',count:12,color:'#d97706'},
    {icon:'💻',label:'Code',count:54,color:'#0891b2'},
    {icon:'🔤',label:'Fonts',count:7,color:'#65a30d'},
    {icon:'❓',label:'Other',count:15,color:'#9b9b93'},
  ];
  return (
    <Shell width={880} height={560}>
      <TopNav active="home" />
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        {/* Sidebar */}
        <div style={{width:220,borderRight:`1px solid ${T.border}`,background:T.surface,display:'flex',flexDirection:'column',flexShrink:0,overflowY:'auto'}}>
          <div style={{padding:'16px 16px 8px',fontSize:11,fontWeight:700,color:T.txt3,letterSpacing:'0.06em',textTransform:'uppercase'}}>File Categories</div>
          <div style={{padding:'0 8px',flex:1}}>
            {cats.map(c=>(
              <div key={c.label} style={{display:'flex',alignItems:'center',gap:9,padding:'7px 10px',borderRadius:8,cursor:'pointer'}}>
                <div style={{width:28,height:28,borderRadius:7,background:c.color+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,flexShrink:0}}>{c.icon}</div>
                <div style={{flex:1,fontSize:13,fontWeight:500,color:T.txt1}}>{c.label}</div>
                <span style={{fontSize:11,color:T.txt3,fontWeight:600}}>{c.count}</span>
              </div>
            ))}
          </div>
          <div style={{padding:'12px 16px',borderTop:`1px solid ${T.border}`}}>
            <div style={{fontSize:11,color:T.txt3,marginBottom:6}}>Extension map</div>
            <Btn variant="ghost" size="sm" style={{width:'100%',justifyContent:'flex-start',gap:6,color:T.txt2,fontSize:12}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M5.93 4.93a10 10 0 0 0 0 14.14"/></svg>
              Edit mappings
            </Btn>
          </div>
        </div>

        {/* Main */}
        <div style={{flex:1,display:'flex',flexDirection:'column',padding:'24px 28px',gap:18,overflowY:'auto'}}>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:T.txt1,letterSpacing:'-0.03em'}}>Organize Files</div>
            <div style={{fontSize:13,color:T.txt3,marginTop:3}}>Select a folder and sort files automatically by type</div>
          </div>

          {/* Drop zone */}
          <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
            style={{border:`2px dashed ${hover?T.accent:T.border2}`,borderRadius:14,padding:'32px 24px',textAlign:'center',background:hover?T.accentLight:T.surface,transition:'all .2s',cursor:'pointer'}}>
            <div style={{width:44,height:44,borderRadius:12,background:hover?T.accent:T.surface2,margin:'0 auto 12px',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .2s'}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={hover?'white':T.txt3} strokeWidth="1.8" strokeLinecap="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <div style={{fontSize:14,fontWeight:700,color:hover?T.accent:T.txt1,marginBottom:4}}>Drop folder here to organize</div>
            <div style={{fontSize:12,color:T.txt3}}>or <span style={{color:T.accent,fontWeight:600,cursor:'pointer'}}>browse</span> to choose a folder</div>
          </div>

          {/* Selected folder */}
          <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:'12px 16px'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:34,height:34,borderRadius:9,background:T.accentLight,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:T.txt1}}>~/Downloads/My Files</div>
                <div style={{fontSize:11,color:T.txt3,marginTop:1}}>347 files · 2.4 GB</div>
              </div>
              <Tag color="green">Ready</Tag>
              <Btn variant="ghost" size="sm" style={{color:T.txt3,padding:'4px 8px'}}>✕</Btn>
            </div>
          </div>

          {/* Options row */}
          <div style={{display:'flex',gap:10}}>
            {[['Rename duplicates','Enabled',T.green],['Recursive','Off',T.txt3],['Auto-organize','Off',T.txt3]].map(([label,val,color])=>(
              <div key={label} style={{flex:1,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:'10px 14px'}}>
                <div style={{fontSize:11,color:T.txt3,marginBottom:3}}>{label}</div>
                <div style={{fontSize:12,fontWeight:700,color}}>{val}</div>
              </div>
            ))}
          </div>

          {/* CTA */}
          <div style={{display:'flex',gap:8,marginTop:'auto'}}>
            <Btn variant="secondary" size="md">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              Preview
            </Btn>
            <Btn variant="primary" size="md" style={{marginLeft:'auto',paddingLeft:28,paddingRight:28}}>
              Organize Now →
            </Btn>
          </div>
        </div>
      </div>
    </Shell>
  );
};

/* ═══════════════════════════════════════
   SCREEN: Preview Mode
═══════════════════════════════════════ */
const Screen_Preview = () => {
  const rows = [
    {folder:'Documents / PDF Files', files:34, size:'142 MB', color:'#16a34a', icon:'📄', sample:['Annual Report 2024.pdf','Invoice_March.pdf','Contract_Draft.pdf']},
    {folder:'Images / JPG Images', files:62, size:'820 MB', color:'#1a6cf0', icon:'🖼', sample:['IMG_4521.jpg','photo_edit.jpg','banner_final.jpg']},
    {folder:'Videos / MP4 Videos', files:12, size:'1.1 GB', color:'#7c3aed', icon:'🎬', sample:['screen_rec.mp4','tutorial_01.mp4']},
    {folder:'Code / Python', files:28, size:'4.2 MB', color:'#0891b2', icon:'💻', sample:['main.py','utils.py','config.py']},
    {folder:'Archives / ZIP', files:8, size:'220 MB', color:'#d97706', icon:'📦', sample:['backup_jan.zip','assets.zip']},
  ];
  const [open, setOpen] = useState({0:true});
  return (
    <Shell width={720} height={600}>
      <TopNav active="home" />
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {/* Header */}
        <div style={{padding:'20px 28px 16px',borderBottom:`1px solid ${T.border}`,background:T.surface,flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:16,fontWeight:800,color:T.txt1,letterSpacing:'-0.02em'}}>Preview Changes</div>
              <div style={{fontSize:12,color:T.txt3,marginTop:2}}>347 files will be moved · 2.4 GB total</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <Btn variant="secondary" size="sm">Cancel</Btn>
              <Btn variant="primary" size="sm">Confirm & Organize</Btn>
            </div>
          </div>
          {/* Summary pills */}
          <div style={{display:'flex',gap:8,marginTop:14}}>
            {[['347 files','blue'],['2.4 GB','blue'],['5 categories','gray'],['12 skipped','amber']].map(([l,c])=><Tag key={l} color={c}>{l}</Tag>)}
          </div>
        </div>

        {/* Tree */}
        <div style={{flex:1,overflowY:'auto',padding:'12px 16px'}}>
          {rows.map((r,i)=>(
            <div key={i} style={{marginBottom:4}}>
              <div onClick={()=>setOpen(o=>({...o,[i]:!o[i]}))}
                style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,background:T.surface,border:`1px solid ${T.border}`,cursor:'pointer',userSelect:'none'}}>
                <span style={{fontSize:16}}>{r.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:T.txt1}}>{r.folder}</div>
                </div>
                <Tag color="gray">{r.files} files</Tag>
                <span style={{fontSize:12,color:T.txt3,minWidth:60,textAlign:'right'}}>{r.size}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={T.txt3} strokeWidth="2" style={{transform:open[i]?'rotate(90deg)':'none',transition:'.15s'}}><polyline points="9 18 15 12 9 6"/></svg>
              </div>
              {open[i] && (
                <div style={{marginLeft:24,borderLeft:`2px solid ${T.border}`,paddingLeft:12,marginTop:2,marginBottom:4}}>
                  {r.sample.map(f=>(
                    <div key={f} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 8px',fontSize:12,color:T.txt2}}>
                      <svg width="10" height="12" viewBox="0 0 10 12" fill="none"><rect x="0.5" y="0.5" width="9" height="11" rx="1.5" fill={r.color+'20'} stroke={r.color} strokeWidth="1"/></svg>
                      {f}
                    </div>
                  ))}
